const CRUMBS={"0": "一步到位！Python 程式設計（第四版）", "1": "一步到位！Python 程式設計（第四版）", "2": "一步到位！Python 程式設計（第四版）", "3": "一步到位！Python 程式設計（第四版）", "4": "一步到位！Python 程式設計（第四版）", "5": "一步到位！Python 程式設計（第四版）", "6": "一步到位！Python 程式設計（第四版）", "7": "一步到位！Python 程式設計（第四版）", "8": "一步到位！Python 程式設計（第四版）", "9": "一步到位！Python 程式設計（第四版）", "10": "一步到位！Python 程式設計（第四版）", "11": "第 9 章  物件導向", "12": "第 9 章  物件導向　›　9-1 認識物件導向", "13": "第 9 章  物件導向　›　9-1 認識物件導向", "14": "第 9 章  物件導向　›　9-1 認識物件導向", "15": "第 9 章  物件導向　›　9-1 認識物件導向", "16": "第 9 章  物件導向　›　9-2 使用類別與物件", "17": "第 9 章  物件導向　›　9-2-1 定義類別", "18": "第 9 章  物件導向　›　9-2-2 建立物件", "19": "第 9 章  物件導向　›　9-2-2 建立物件", "20": "第 9 章  物件導向　›　9-2-2 建立物件", "21": "第 9 章  物件導向　›　9-2-3 __init__() 方法", "22": "第 9 章  物件導向　›　9-2-3 __init__() 方法", "23": "第 9 章  物件導向　›　9-2-4 匿名物件", "24": "第 9 章  物件導向　›　9-2-5 私有成員 (私有屬性與私有方法)", "25": "第 9 章  物件導向　›　9-2-5 私有成員 (私有屬性與私有方法)", "26": "第 9 章  物件導向　›　9-2-5 私有成員 (私有屬性與私有方法)", "27": "第 9 章  物件導向　›　9-2-5 私有成員 (私有屬性與私有方法)", "28": "第 9 章  物件導向　›　9-3 繼承", "29": "第 9 章  物件導向　›　9-3 繼承", "30": "第 9 章  物件導向　›　9-3-1 定義子類別", "31": "第 9 章  物件導向　›　9-3-1 定義子類別", "32": "第 9 章  物件導向　›　9-3-1 定義子類別", "33": "第 9 章  物件導向　›　9-3-1 定義子類別", "34": "第 9 章  物件導向　›　9-3-2 覆蓋繼承自父類別的方法", "35": "第 9 章  物件導向　›　9-3-2 覆蓋繼承自父類別的方法", "36": "第 9 章  物件導向　›　9-3-3 呼叫父類別內被覆蓋的方法", "37": "第 9 章  物件導向　›　9-3-3 呼叫父類別內被覆蓋的方法", "38": "第 9 章  物件導向　›　9-3-3 呼叫父類別內被覆蓋的方法", "39": "第 9 章  物件導向　›　9-3-4 isinstance() 與 issubclass() 函式", "40": "第 9 章  物件導向　›　9-3-4 isinstance() 與 issubclass() 函式", "41": "第 9 章  物件導向　›　9-3-4 isinstance() 與 issubclass() 函式", "42": "第 9 章  物件導向　›　9-4 多型", "43": "第 9 章  物件導向　›　9-4 多型", "44": "第 9 章  物件導向　›　9-4 多型", "45": "第 9 章  物件導向　›　學習評量", "46": "第 9 章  物件導向　›　學習評量", "47": "第 9 章  物件導向　›　學習評量", "48": "第 9 章  物件導向　›　學習評量"};
const TREE=[{"t": "封面", "k": "", "p": 0}, {"t": "原書目錄", "k": "", "p": 1, "c": [{"t": "第 1 頁", "k": "", "p": 1}, {"t": "第 2 頁", "k": "", "p": 2}, {"t": "第 3 頁", "k": "", "p": 3}, {"t": "第 4 頁", "k": "", "p": 4}, {"t": "第 5 頁", "k": "", "p": 5}, {"t": "第 6 頁", "k": "", "p": 6}, {"t": "第 7 頁", "k": "", "p": 7}, {"t": "第 8 頁", "k": "", "p": 8}, {"t": "第 9 頁", "k": "", "p": 9}, {"t": "第 10 頁", "k": "", "p": 10}]}, {"t": "型別、變數與運算子", "k": "第2章", "u": "ch2.html"}, {"t": "數值與字串處理", "k": "第3章", "u": "ch3.html"}, {"t": "流程控制", "k": "第4章", "u": "ch4.html"}, {"t": "函式", "k": "第5章", "u": "ch5.html"}, {"t": "list、tuple、set 與 dict", "k": "第6章", "u": "ch6.html"}, {"t": "物件導向", "k": "第9章", "p": 11, "c": [{"t": "認識物件導向", "k": "9-1", "p": 12, "c": []}, {"t": "使用類別與物件", "k": "9-2", "p": 16, "c": [{"t": "定義類別", "k": "9-2-1", "p": 17}, {"t": "建立物件", "k": "9-2-2", "p": 18}, {"t": "__init__() 方法", "k": "9-2-3", "p": 21}, {"t": "匿名物件", "k": "9-2-4", "p": 23}, {"t": "私有成員 (私有屬性與私有方法)", "k": "9-2-5", "p": 24}]}, {"t": "繼承", "k": "9-3", "p": 28, "c": [{"t": "定義子類別", "k": "9-3-1", "p": 30}, {"t": "覆蓋繼承自父類別的方法", "k": "9-3-2", "p": 34}, {"t": "呼叫父類別內被覆蓋的方法", "k": "9-3-3", "p": 36}, {"t": "isinstance() 與 issubclass() 函式", "k": "9-3-4", "p": 39}]}, {"t": "多型", "k": "9-4", "p": 42, "c": []}, {"t": "學習評量", "k": "", "p": 45, "c": []}], "here": 1}];
const START=11;

let cur=0; const rows={};
function build(nodes,ul,lvl){
  for(const n of nodes){
    const li=document.createElement('li');
    li.className='lvl'+lvl+(n.c&&n.c.length?' closed':'')+(n.u?' ext':'');
    let row;
    if(n.u){row=document.createElement('a');row.href=n.u;row.className='row';}
    else{row=document.createElement('div');row.className='row';row.tabIndex=0;row.setAttribute('role','button');}
    const tg=document.createElement('span');tg.className='tg';
    tg.textContent=(n.c&&n.c.length)?'▸':'';
    tg.onclick=e=>{e.stopPropagation();e.preventDefault();li.classList.toggle('closed');
      tg.textContent=li.classList.contains('closed')?'▸':'▾';};
    const k=document.createElement('span');k.className='k';k.textContent=n.k||'';
    const t=document.createElement('span');t.textContent=n.t;
    row.append(tg,k,t);
    if(!n.u){
      row.onclick=()=>{go(n.p);if(n.c&&n.c.length){li.classList.remove('closed');tg.textContent='▾';}
        if(innerWidth<=860)document.body.classList.remove('open');};
      row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.onclick();}};
      if(!(n.p in rows)||lvl>=rows[n.p].lvl)rows[n.p]={el:row,li,lvl};
    }
    li.append(row);
    if(n.here){li.classList.remove('closed');tg.textContent='▾';}
    if(n.c&&n.c.length){const s=document.createElement('ul');s.className='n';build(n.c,s,lvl+1);li.append(s);}
    ul.append(li);
  }
}
build(TREE,document.getElementById('tree'),0);
function go(p,push=true){
  if(p<0||p>=PAGES.length)return;
  cur=p;
  document.getElementById('img').src='img/'+PAGES[p];
  document.getElementById('pin').value=p+1;
  document.getElementById('lab').textContent=LABELS[p]||'';
  document.getElementById('crumb').textContent=CRUMBS[p]||'';
  document.querySelectorAll('.row.cur').forEach(e=>e.classList.remove('cur'));
  let best=null;
  for(const k in rows)if(+k<=p&&(best===null||+k>best))best=+k;
  if(best!==null){
    const r=rows[best];r.el.classList.add('cur');
    let li=r.li;
    while(li&&li.id!=='tree'){
      if(li.tagName==='LI'){li.classList.remove('closed');
        const tg=li.querySelector(':scope > .row > .tg');if(tg&&tg.textContent)tg.textContent='▾';}
      li=li.parentElement;
    }
    r.el.scrollIntoView({block:'nearest'});
  }
  if(push)history.replaceState(null,'','#p'+(p+1));
  window.scrollTo(0,0);
  if(p+1<PAGES.length){const im=new Image();im.src='img/'+PAGES[p+1];}
}
function filterTree(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll('#tree li').forEach(li=>{
    li.style.display=(!q||li.textContent.toLowerCase().includes(q))?'':'none';
    if(q)li.classList.remove('closed');
  });
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1);e.preventDefault();}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault();}
  if(e.key==='Home')go(0);
  if(e.key==='End')go(PAGES.length-1);
});
const m0=location.hash.match(/p(\d+)/);
go(m0?+m0[1]-1:START,false);
