<style>
:root{--bg:#F7F6F2;--panel:#FFFFFF;--ink:#1E2229;--muted:#6A7482;--line:#E3E1DA;
--acc:#2F6DB5;--acc-ink:#FFFFFF;--mark:#F5C542;--mark-ink:#1E2229;--hover:#EEF3FA;
--shadow:0 2px 14px rgba(30,34,41,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181D;--panel:#1C2026;
--ink:#E6E8EB;--muted:#9AA4B1;--line:#2C323B;--acc:#6FA3E8;--acc-ink:#0F1520;--mark:#E2B93B;
--mark-ink:#1A1206;--hover:#242B35;--shadow:0 2px 14px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#15181D;--panel:#1C2026;--ink:#E6E8EB;--muted:#9AA4B1;--line:#2C323B;
--acc:#6FA3E8;--acc-ink:#0F1520;--mark:#E2B93B;--mark-ink:#1A1206;--hover:#242B35;
--shadow:0 2px 14px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:14px;
font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
a{color:var(--acc)}
img{max-width:100%}

body{--sw:0px}
body.nav{--sw:322px}
#side{position:fixed;left:0;top:0;bottom:0;width:322px;background:var(--panel);
border-right:1px solid var(--line);overflow:auto;padding:14px 10px 40px;z-index:12;
transform:translateX(-100%);transition:transform .2s}
body.nav #side{transform:none}
.brand{padding:4px 46px 10px 8px;text-decoration:none;color:inherit;display:block}
#close{display:none;position:absolute;top:10px;right:10px;z-index:2;border:1px solid var(--line);
background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 11px;font:inherit;
font-size:17px;line-height:1;cursor:pointer}
#close:hover{background:var(--hover)}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:11}
.brand .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:"Noto Serif TC",Georgia,serif;font-weight:700;font-size:19px;
line-height:1.3;margin:5px 0 0;text-wrap:balance}
#q{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;
background:var(--bg);color:var(--ink);font:inherit;margin:6px 0 10px}
#q:focus{outline:2px solid var(--acc);outline-offset:1px}
.n{list-style:none;margin:0;padding:0}.n .n{padding-left:15px}.n li{margin:1px 0}
.row{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:5px;cursor:pointer;
line-height:1.4;color:inherit;text-decoration:none;font-size:15.5px}
.row:hover{background:var(--hover)}
.row:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.row.cur{background:var(--acc);color:var(--acc-ink)}
.row .k{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--muted);
flex:none;min-width:2.4em}
.row.cur .k{color:var(--acc-ink)}
.tg{width:22px;flex:none;color:var(--muted);font-size:11px;text-align:center;user-select:none;
align-self:stretch;display:flex;align-items:center;justify-content:center;border-radius:4px}
.tg:hover{background:rgba(128,128,128,.22)}
.row.cur .tg{color:var(--acc-ink)}
.lvl0>.row{font-weight:600}
.lvl2>.row{font-size:14.5px}
li.closed>ul{display:none}
.sec{margin:16px 8px 5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column}
#bar{position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap}
#bar button,#bar select{border:1px solid var(--line);background:var(--panel);color:var(--ink);
border-radius:6px;padding:5px 11px;cursor:pointer;font:inherit}
#bar button:hover,#bar select:hover{background:var(--hover)}
#bar button:focus-visible,#bar select:focus-visible{outline:2px solid var(--acc)}
#pg{font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px}
#pin{width:60px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px;
background:var(--bg);color:var(--ink);font:inherit}
#lab{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;background:var(--mark);
color:var(--mark-ink);padding:2px 8px;border-radius:4px;min-width:3.4em;text-align:center}
#crumb{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:120px}
#view{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:18px;position:relative}
#view.loading img{opacity:.3}
#view.loading::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;
margin:-17px 0 0 -17px;border:3px solid var(--line);border-top-color:var(--acc);
border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#view.loading::after{animation:none}}
#view img{height:auto;background:#fff;box-shadow:var(--shadow);border-radius:2px}
#view.fit img{max-height:calc(100vh - 94px);width:auto}
/* 左右兩側的隱形翻頁區 */
.zone{position:fixed;top:58px;bottom:0;width:clamp(58px,11vw,150px);z-index:4;border:0;padding:0;
background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;
display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:34px;
line-height:1;opacity:0;transition:opacity .18s}
.zone:hover,.zone:focus-visible{opacity:.42;background:linear-gradient(var(--dir),
rgba(128,128,128,.16),rgba(128,128,128,0))}
.zone:focus-visible{outline:2px solid var(--acc);outline-offset:-3px;opacity:.6}
.zone[disabled]{cursor:default}
.zone[disabled]:hover{opacity:0;background:transparent}
#zL{left:var(--sw);--dir:to right}
#zR{right:0;--dir:to left}
#menu{font-size:17px;line-height:1;padding:5px 12px}
@media (max-width:860px){body.nav{--sw:0px}
#side{width:min(322px,88vw)}#crumb{display:none}
#close{display:block}body.nav #scrim{display:block}
.zone{opacity:0}}
@media (prefers-reduced-motion:reduce){#side,.zone{transition:none}}
</style>

let cur=-1; const rows={}; const cache=[]; let seq=0;
function showPage(p){                     // 背景先載好才換圖，避免畫面卡住不動
  const v=document.getElementById('view'), el=document.getElementById('img');
  const src='img/'+PAGES[p], my=++seq, pre=new Image();
  pre.src=src;
  if(pre.complete){el.src=src;v.classList.remove('loading');return;}   // 已在快取 → 立刻換
  const t=setTimeout(()=>{if(my===seq)v.classList.add('loading');},150); // 太快就不閃轉圈
  pre.onload=pre.onerror=()=>{
    clearTimeout(t);
    if(my!==seq)return;
    el.src=src;v.classList.remove('loading');
  };
}
function shut(el){                              // 收起某一列，連同它底下所有子目錄
  const one=d=>{
    if(!d.querySelector(':scope > ul'))return;
    d.classList.add('closed');
    const t=d.querySelector(':scope > .row > .tg');
    if(t&&t.textContent)t.textContent='▸';
  };
  one(el);
  el.querySelectorAll('li').forEach(one);
}
function build(nodes,ul,lvl){
  for(const n of nodes){
    const kids=n.c&&n.c.length;
    const li=document.createElement('li');
    li.className='lvl'+lvl+(kids?' closed':'');
    const row=document.createElement('div');
    row.className='row';row.tabIndex=0;row.setAttribute('role','button');
    const tg=document.createElement('span');tg.className='tg';
    tg.textContent=kids?'▸':'';
    const k=document.createElement('span');k.className='k';k.textContent=n.k||'';
    const t=document.createElement('span');t.textContent=n.t;
    row.append(tg,k,t);
    tg.onclick=e=>{                             // 只有箭頭負責展開／收合
      e.stopPropagation();
      if(!kids)return;
      if(li.classList.contains('closed')){
        if(lvl===0)li.parentElement.querySelectorAll(':scope > li')
                     .forEach(o=>{if(o!==li)shut(o);});     // 其他章連同子目錄收起
        li.classList.remove('closed');tg.textContent='▾';
      }else{
        shut(li);                               // 收合時子目錄一起收
      }
      const c=document.querySelector('.row.cur');   // 標示的那列被收掉 → 改標示看得到的
      if(c&&cur>=0&&!c.closest('li').offsetParent)go(cur,false,false);
    };
    row.onclick=()=>{                           // 點文字只跳頁，不展開
      go(n.p,true,false,row);
      if(innerWidth<=860)setNav(false);
    };
    row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.onclick();}};
    (rows[n.p]=rows[n.p]||[]).push({el:row,li,lvl});   // 同一頁可能有好幾列
    li.append(row);
    if(kids){const s=document.createElement('ul');s.className='n';build(n.c,s,lvl+1);li.append(s);}
    ul.append(li);
  }
}
build(TREE,document.getElementById('tree'),0);

function openTo(li){                            // 展開某列的所有上層
  while(li&&li.id!=='tree'){
    if(li.tagName==='LI'){
      li.classList.remove('closed');
      const tg=li.querySelector(':scope > .row > .tg');
      if(tg&&tg.textContent)tg.textContent='▾';
    }
    li=li.parentElement;
  }
}
function go(p,push=true,expand=true,el=null){   // el＝你實際點的那一列
  if(p<0||p>=PAGES.length)return;
  cur=p;
  showPage(p);
  document.getElementById('pin').value=p+1;
  document.getElementById('lab').textContent=LABELS[p]||'';
  document.getElementById('crumb').textContent=CRUMBS[p]||'';
  document.getElementById('zL').disabled=(p===0);
  document.getElementById('zR').disabled=(p===PAGES.length-1);
  document.querySelectorAll('.row.cur').forEach(e=>e.classList.remove('cur'));
  let best=null;
  for(const k in rows)if(+k<=p&&(best===null||+k>best))best=+k;
  if(best!==null){
    const list=rows[best];
    if(expand)list.forEach(r=>openTo(r.li));
    let pick=null;
    if(el)for(const r of list)if(r.el===el&&r.li.offsetParent)pick=el;   // 點哪一列就標哪一列
    if(!pick)for(const r of list)if(r.li.offsetParent)pick=r.el;         // 翻頁時取看得到的最深那列
    if(!pick){                                                          // 全被收起來 → 往上找看得到的
      let li=list[0].li,e=list[0].el;
      while(li&&!li.offsetParent){
        li=li.parentElement&&li.parentElement.closest('li');
        e=li?li.querySelector(':scope > .row'):null;
      }
      pick=e;
    }
    if(pick){pick.classList.add('cur');pick.scrollIntoView({block:'nearest'});}
  }
  if(push)history.replaceState(null,'','#p'+(p+1));
  window.scrollTo(0,0);
  for(const d of [1,2,3,-1,-2]){          // 預載前後幾頁，翻頁才不會等
    const q=p+d;
    if(q>=0&&q<PAGES.length){const im=new Image();im.src='img/'+PAGES[q];cache.push(im);}
  }
  while(cache.length>8)cache.shift();
}
const step=d=>go(cur+d,true,false);             // 翻頁一律不強制展開目錄

function setNav(on){                            // 側欄開關（記住上次的選擇）
  document.body.classList.toggle('nav',on);
  try{localStorage.setItem('nav',on?'1':'0');}catch(e){}
}
function toggleNav(){setNav(!document.body.classList.contains('nav'));}
(function(){
  let v=null;
  try{v=localStorage.getItem('nav');}catch(e){}
  const on=(v===null)?matchMedia('(min-width:861px)').matches:(v==='1');
  document.body.classList.toggle('nav',on);
})();

let snap=null;                                  // 搜尋前的展開／收合狀態
function filterTree(q){
  q=q.trim().toLowerCase();
  const lis=document.querySelectorAll('#tree li');
  const arrow=li=>{const t=li.querySelector(':scope > .row > .tg');
    if(t&&t.textContent)t.textContent=li.classList.contains('closed')?'▸':'▾';};
  if(q){
    if(snap===null){snap=[];lis.forEach(li=>snap.push(li.classList.contains('closed')));}
    lis.forEach(li=>{
      li.style.display=li.textContent.toLowerCase().includes(q)?'':'none';
      li.classList.remove('closed');arrow(li);
    });
  }else{                                        // 清空搜尋 → 還原成搜尋前的樣子
    lis.forEach((li,i)=>{
      li.style.display='';
      li.classList.toggle('closed',!!(snap&&snap[i]));
      arrow(li);
    });
    snap=null;
  }
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){step(1);e.preventDefault();}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){step(-1);e.preventDefault();}
  if(e.key==='Home')go(0,true,false);
  if(e.key==='End')go(PAGES.length-1,true,false);
});
addEventListener('hashchange',()=>{const m=location.hash.match(/p(\d+)/);if(m)go(+m[1]-1,false,false);});
const m0=location.hash.match(/p(\d+)/);
go(m0?+m0[1]-1:0,false,false);   // 一開始目錄全部收合

// 閒置時依序把目錄會跳到的頁面先抓進瀏覽器快取，之後點目錄就不用等。
// 不保留參考（交給 HTTP 快取），省記憶體；行動網路省流量模式或 2G 則略過。
(function warm(){
  const c=navigator.connection;
  if(c&&(c.saveData||/(^|-)2g$/.test(c.effectiveType||'')))return;
  const idle=window.requestIdleCallback||(fn=>setTimeout(fn,350));
  const list=Object.keys(rows).map(Number).sort((a,b)=>a-b);
  let i=0;
  (function step(){
    if(i>=list.length)return;
    new Image().src='img/'+PAGES[list[i++]];
    idle(()=>setTimeout(step,250));
  })();
})();
