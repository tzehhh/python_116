let cur=0; const rows={};
function build(nodes,ul,lvl){
  for(const n of nodes){
    const li=document.createElement('li');
    li.className='lvl'+lvl+(n.c&&n.c.length?' closed':'')+(n.u?' ext':'');
    let row;
    if(n.u){row=document.createElement('a');row.href=n.u;row.className='row';}
    else{row=document.createElement('div');row.className='row';row.tabIndex=0;row.setAttribute('role','button');}
    const tg=document.createElement('span');tg.className='tg';
    tg.textContent=(n.c&&n.c.length)?'▸':'';
    tg.onclick=e=>{e.stopPropagation();e.preventDefault();li.classList.toggle('closed');
      tg.textContent=li.classList.contains('closed')?'▸':'▾';};
    const k=document.createElement('span');k.className='k';k.textContent=n.k||'';
    const t=document.createElement('span');t.textContent=n.t;
    row.append(tg,k,t);
    if(!n.u){
      row.onclick=()=>{go(n.p);if(n.c&&n.c.length){li.classList.remove('closed');tg.textContent='▾';}
        if(innerWidth<=860)document.body.classList.remove('open');};
      row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.onclick();}};
      if(!(n.p in rows)||lvl>=rows[n.p].lvl)rows[n.p]={el:row,li,lvl};
    }
    li.append(row);
    if(n.here){li.classList.remove('closed');tg.textContent='▾';}
    if(n.c&&n.c.length){const s=document.createElement('ul');s.className='n';build(n.c,s,lvl+1);li.append(s);}
    ul.append(li);
  }
}
build(TREE,document.getElementById('tree'),0);
function go(p,push=true){
  if(p<0||p>=PAGES.length)return;
  cur=p;
  document.getElementById('img').src='img/'+PAGES[p];
  document.getElementById('pin').value=p+1;
  document.getElementById('lab').textContent=LABELS[p]||'';
  document.getElementById('crumb').textContent=CRUMBS[p]||'';
  document.querySelectorAll('.row.cur').forEach(e=>e.classList.remove('cur'));
  let best=null;
  for(const k in rows)if(+k<=p&&(best===null||+k>best))best=+k;
  if(best!==null){
    const r=rows[best];r.el.classList.add('cur');
    let li=r.li;
    while(li&&li.id!=='tree'){
      if(li.tagName==='LI'){li.classList.remove('closed');
        const tg=li.querySelector(':scope > .row > .tg');if(tg&&tg.textContent)tg.textContent='▾';}
      li=li.parentElement;
    }
    r.el.scrollIntoView({block:'nearest'});
  }
  if(push)history.replaceState(null,'','#p'+(p+1));
  window.scrollTo(0,0);
  if(p+1<PAGES.length){const im=new Image();im.src='img/'+PAGES[p+1];}
}
function filterTree(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll('#tree li').forEach(li=>{
    li.style.display=(!q||li.textContent.toLowerCase().includes(q))?'':'none';
    if(q)li.classList.remove('closed');
  });
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1);e.preventDefault();}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault();}
  if(e.key==='Home')go(0);
  if(e.key==='End')go(PAGES.length-1);
});
